baseURL: "https://stedronin.europen.cz/"
locale: cs-CZ
DefaultContentLanguage: cs
title: Mezioborový seminář Štědronín 2026
description: Mezioborový seminář EurOpen.CZ Štědronín 27. listopadu 2026 — páteční odpoledne plné inspirativních přednášek z různých oborů pro odborníky z IT i širokou veřejnost. Štědronín u Zvíkova, Písecko.
author: Jiří Sitera

menus:
  main:
    - name: EurOpen.CZ
      weight: 10
      url: "https://www.europen.cz/"
    - name: Program
      weight: 20
      url: "/#td-block-2"
    - name: Přihlásit se
      weight: 30
      url: "/#prihlaska" # TODO: odkaz na přihlášku, stejný jako params.registration_url
    - name: O stránce
      weight: 40
      pageRef: /about

params:
  # TODO: odkaz na přihlášku 2026 (použit v content/_index.md přes {{< param registration_url >}})
  registration_url: "/#prihlaska"
  subtitle: Mezioborový seminář Štědronín 27. listopadu 2026
  images:
    - stedronin-social-card.jpg
  ui:
    footer_about_enable: true
    navbar_logo: false
  links:
    user:
      - name: Facebooková skupina
        url: 'https://www.facebook.com/groups/199751946725860/'
        icon: fab fa-facebook
        desc: EurOpen.CZ Facebook group and page
      - name: LinkedIn skupina
        url: 'https://www.linkedin.com/groups/81933'
        icon: fab fa-linkedin
        desc: EurOpen.CZ LinkedIn profile
      - name: Elektronická konference komunity
        url: 'https://groups.google.com/g/europen-cz'
        icon: fa fa-envelope
        desc: Elektronická konference členů a podporovatelů
    developer:
      - name: EurOpen.CZ GitHub profil
        url: 'https://github.com/europen-cz'
        icon: fab fa-github
        desc: GitHub organizace
      - name: Kontaktní e-mail sdružení
        url: 'mailto:europen@europen.cz'
        icon: fa fa-envelope
        desc: Hlavní kontakt EurOpen.CZ

enableRobotsTXT: true

security:
  node:
    permissions:
      allowRead: ['.', '$CACHE', '$PWD/node_modules']

module:
  proxy: direct
  hugoVersion:
    extended: true
    min: 0.73.0
  imports:
    - path: github.com/google/docsy
      disable: false

markup:
  goldmark:
    parser:
      attribute:
        block: true
    renderer:
      unsafe: true
  highlight:
    style: tango
